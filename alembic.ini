# Configuración de Alembic (migraciones de PostgreSQL, DT-01).
# La conexión NO va aquí: migraciones/env.py la lee del .env con app/ajustes.py.
#   alembic upgrade head                  -> base patitas
#   alembic -x pruebas=true upgrade head  -> base patitas_test

[alembic]
script_location = %(here)s/migraciones
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
