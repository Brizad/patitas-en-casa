name: CI

on:
  push:
    branches: [main]
  # Todos los PR, también los apilados que apuntan a otra rama (P-02 de docs/aprende).
  pull_request:

permissions:
  contents: read

jobs:
  build-lint-test:
    runs-on: ubuntu-24.04
    services:
      # Base de pruebas temporal (DT-01): se crea y se borra en cada ejecución.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_TEST_PASSWORD }}
          POSTGRES_DB: patitas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Descargar el código
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # historial completo: gitleaks revisa todos los commits

      # Detección de secretos (#33). Versión fija de la imagen oficial de gitleaks.
      - name: Secretos (auto-prueba de gitleaks)
        run: |
          # Un token falso, generado aquí y nunca guardado, DEBE ser detectado.
          docker pull --quiet "$GITLEAKS_IMAGEN"
          mkdir -p "$RUNNER_TEMP/senuelo"
          echo "token = \"ghp_$(openssl rand -hex 18)\"" > "$RUNNER_TEMP/senuelo/config.txt"
          set +e
          docker run --rm -v "$RUNNER_TEMP/senuelo:/scan" "$GITLEAKS_IMAGEN" \
            dir /scan --redact --no-banner --exit-code 7
          codigo=$?
          set -e
          # 7 = encontró el secreto; cualquier otro código es un error o un falso negativo.
          if [ "$codigo" -ne 7 ]; then
            echo "::error::gitleaks no detectó el token de prueba (código $codigo)"; exit 1
          fi
          echo "Auto-prueba correcta: gitleaks detecta secretos."
        env:
          GITLEAKS_IMAGEN: ghcr.io/gitleaks/gitleaks:v8.30.1

      - name: Secretos (gitleaks sobre todo el historial)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" "$GITLEAKS_IMAGEN" \
            git /repo --redact --no-banner --verbose
        env:
          GITLEAKS_IMAGEN: ghcr.io/gitleaks/gitleaks:v8.30.1

      - name: Preparar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Build (instalar dependencias)
        run: pip install -r requirements-dev.txt

      - name: Lint (Ruff)
        run: ruff check .

      - name: Test (pytest con cobertura)
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_TEST_PASSWORD }}
          POSTGRES_DB_PRUEBAS: patitas_test
          # Sin Postgres, las pruebas de base de datos fallan en vez de omitirse.
          PATITAS_EXIGIR_POSTGRES: "1"
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70

      # Panel del personal en React (#64): tipos, pruebas y compilación.
      - name: Preparar Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Panel (tipos, pruebas y build)
        working-directory: panel
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

      # RNF-11 (#147): accesibilidad medida con axe-core (cada pantalla, cada rol, claro y
      # oscuro) y Lighthouse (pantallas públicas, puntaje 100) sobre el panel recién compilado.
      # La contraseña de las cuentas de demostración es aleatoria y vive solo en este paso.
      - name: Accesibilidad (axe-core y Lighthouse)
        working-directory: scripts/accesibilidad
        run: |
          npm ci --no-audit --no-fund
          clave="$(openssl rand -hex 16)"
          echo "::add-mask::$clave"
          export PATITAS_DEMO_CONTRASENA="$clave"
          python servidor_demo.py 8765 &
          curl -sf -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8765/
          CHROME_PATH="$(command -v google-chrome)" node revisar.mjs

      - name: Guardar el informe de accesibilidad
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: informe-accesibilidad
          path: scripts/accesibilidad/informe.json
          if-no-files-found: ignore

  # #233: flujo completo en el navegador sobre una instancia real (API + PostgreSQL + panel
  # compilado + PWA) con los datos de demostración. Si falla, deja capturas y trazas.
  e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_TEST_PASSWORD }}
          POSTGRES_DB: patitas_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_TEST_PASSWORD }}
      POSTGRES_DB: patitas_e2e
      PATITAS_DEMO_ACTIVA: "true"
    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Preparar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Preparar Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            panel/package-lock.json
            e2e/package-lock.json

      - name: Instalar y compilar el panel
        run: |
          pip install -r requirements.txt
          cd panel && npm ci --no-audit --no-fund && npm run build

      # Claves aleatorias que viven solo en esta ejecución (nunca en el repositorio).
      - name: Claves de la instancia
        run: |
          for nombre in PATITAS_JWT_SECRETO PATITAS_CLAVE_DATOS PATITAS_DEMO_CONTRASENA; do
            valor="$(openssl rand -hex 32)"
            echo "::add-mask::$valor"
            echo "$nombre=$valor" >> "$GITHUB_ENV"
          done

      - name: Migrar la base y arrancar la API
        run: |
          alembic upgrade head
          uvicorn --factory app.api.main:crear_app --port 8010 > api.log 2>&1 &
          curl -sf -o /dev/null --retry 30 --retry-connrefused --retry-delay 1             http://127.0.0.1:8010/app/

      - name: Pruebas de punta a punta (Playwright)
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright test

      - name: Guardar capturas y trazas si falla
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-capturas
          # #316: resultados/ trae las diferencias de la regresión visual (-actual, -expected y
          # -diff); capturas/ trae las capturas base nuevas cuando faltaban.
          path: |
            e2e/resultados/
            e2e/capturas/
            e2e/informe/
            api.log
          retention-days: 14
