name: CI

on:
  push:
    branches: [main]
  # Todos los PR, también los apilados que apuntan a otra rama (P-02 de docs/aprende).
  pull_request:

permissions:
  contents: read

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    services:
      # Base de pruebas temporal (DT-01): se crea y se borra en cada ejecución.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_TEST_PASSWORD }}
          POSTGRES_DB: patitas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historial completo: gitleaks revisa todos los commits

      # Detección de secretos (#33). Versión fija de la imagen oficial de gitleaks.
      - name: Secretos (auto-prueba de gitleaks)
        run: |
          # Un token falso, generado aquí y nunca guardado, DEBE ser detectado.
          docker pull --quiet "$GITLEAKS_IMAGEN"
          mkdir -p "$RUNNER_TEMP/senuelo"
          echo "token = \"ghp_$(openssl rand -hex 18)\"" > "$RUNNER_TEMP/senuelo/config.txt"
          set +e
          docker run --rm -v "$RUNNER_TEMP/senuelo:/scan" "$GITLEAKS_IMAGEN" \
            dir /scan --redact --no-banner --exit-code 7
          codigo=$?
          set -e
          # 7 = encontró el secreto; cualquier otro código es un error o un falso negativo.
          if [ "$codigo" -ne 7 ]; then
            echo "::error::gitleaks no detectó el token de prueba (código $codigo)"; exit 1
          fi
          echo "Auto-prueba correcta: gitleaks detecta secretos."
        env:
          GITLEAKS_IMAGEN: ghcr.io/gitleaks/gitleaks:v8.30.1

      - name: Secretos (gitleaks sobre todo el historial)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" "$GITLEAKS_IMAGEN" \
            git /repo --redact --no-banner --verbose
        env:
          GITLEAKS_IMAGEN: ghcr.io/gitleaks/gitleaks:v8.30.1

      - name: Preparar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build (instalar dependencias)
        run: pip install -r requirements-dev.txt

      - name: Lint (Ruff)
        run: ruff check .

      - name: Test (pytest con cobertura)
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_TEST_PASSWORD }}
          POSTGRES_DB_PRUEBAS: patitas_test
          # Sin Postgres, las pruebas de base de datos fallan en vez de omitirse.
          PATITAS_EXIGIR_POSTGRES: "1"
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70

      # Panel del personal en React (#64): tipos, pruebas y compilación.
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Panel (tipos, pruebas y build)
        working-directory: panel
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
