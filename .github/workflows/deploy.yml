name: Verificar despliegue

# Guía 11 (PLAN_CIERRE, trabajo 6b). Render despliega solo desde `main` (render.yaml,
# autoDeploy). Este flujo NO despliega: comprueba, después de cada CI verde en `main`, que
# producción quedó corriendo la versión nueva y que responde. Si los despliegues fallan, Render
# deja viva la versión anterior y nadie se entera (así pasó el 20-nov-2026: 6 despliegues
# fallidos seguidos con la API en 1.1.0). Aquí queda en rojo y con el motivo.
#
# Reversa (rollback): solo si existen los secretos RENDER_API_KEY y RENDER_SERVICE_ID, y solo
# cuando la versión nueva SÍ quedó viva pero no responde bien. Sin esos secretos el flujo no
# pide nada nuevo: verifica y avisa. Para activarla, ver docs/aprende/despliegue.md.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificar-despliegue
  cancel-in-progress: true

env:
  URL: https://patitas-en-casa-pnnk.onrender.com

jobs:
  verificar:
    # Solo si el CI de main salió en verde (o si se lanza a mano).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      viva: ${{ steps.espera.outputs.viva }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Versión que debería estar en producción
        id: esperada
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Versión esperada: $version"

      - name: Esperar a que producción corra ese commit (hasta 20 min)
        id: espera
        env:
          ESPERADA: ${{ steps.esperada.outputs.version }}
          COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          # Parte 7c: la versión de pyproject no cambia en cada PR, así que comparar solo la versión
          # daba verde aunque Render siguiera con el código anterior. Ahora se espera el commit que
          # producción dice en la cabecera X-Version-Commit (Render pone RENDER_GIT_COMMIT). Si esa
          # cabecera no existe (despliegue anterior a la parte 7c), se compara la versión y se avisa.
          # Un despliegue de Render tarda de 5 a 10 min; el primer intento puede despertar el servicio.
          for intento in $(seq 1 40); do
            commit=$(curl -s -m 60 -o /dev/null -D - "$URL/app/" | tr -d '\r' \
              | awk 'tolower($1)=="x-version-commit:" {print $2}')
            if [ -n "$commit" ]; then
              echo "intento $intento: producción corre el commit ${commit:0:7}, se espera ${COMMIT:0:7}"
              if [ "$commit" = "$COMMIT" ]; then echo "viva=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            else
              actual=$(curl -s -m 60 "$URL/openapi.json" | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])" 2>/dev/null || true)
              echo "intento $intento: sin X-Version-Commit; producción dice «${actual:-sin respuesta}», se espera «$ESPERADA»"
              if [ "$actual" = "$ESPERADA" ] && [ "$intento" -ge 20 ]; then
                echo "::warning::Producción no dice su commit: se confirmó solo la versión."
                echo "viva=true" >> "$GITHUB_OUTPUT"; exit 0
              fi
            fi
            sleep 30
          done
          echo "viva=false" >> "$GITHUB_OUTPUT"
          echo "::error::Producción no llegó al commit ${COMMIT:0:7} (versión $ESPERADA) en 20 minutos. Render dejó viva la anterior: abre el despliegue fallido en el panel de Render (Events → Deploys) y lee el registro."
          exit 1

      - name: La PWA y la API de reportes responden
        run: |
          pwa=$(curl -s -o /dev/null -m 90 -w "%{http_code}" "$URL/app/")
          api=$(curl -s -o /dev/null -m 30 -w "%{http_code}" "$URL/reportes/NOEXISTE")
          echo "/app/ $pwa · GET /reportes/{codigo} $api"
          [ "$pwa" = 200 ] && [ "$api" = 404 ]

  revertir:
    # Solo cuando la versión nueva quedó viva pero la verificación posterior falló, y solo si
    # los secretos existen. Si el despliegue ni siquiera llegó a vivir, Render ya conserva la
    # anterior y no hay nada que revertir.
    needs: verificar
    if: ${{ failure() && needs.verificar.outputs.viva == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Volver al despliegue anterior
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "::warning::Falta RENDER_API_KEY o RENDER_SERVICE_ID: no se revierte. Pasos en docs/aprende/despliegue.md."
            exit 0
          fi
          anterior=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=5" \
            | python3 -c "import sys,json; d=[x['deploy'] for x in json.load(sys.stdin) if x['deploy']['status']=='deactivated']; print(d[0]['id'] if d else '')")
          [ -n "$anterior" ] || { echo "::error::No hay un despliegue anterior al que volver."; exit 1; }
          curl -s -X POST -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" \
            -d "{\"deployId\": \"$anterior\"}" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/rollback"
          echo "Revertido al despliegue $anterior"
