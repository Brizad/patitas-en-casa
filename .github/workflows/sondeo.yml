name: Sondeo de disponibilidad

# RNF-04 (#119): sondeo externo de la PWA. GitHub ejecuta un cron como mínimo cada 5 minutos y a
# veces se retrasa: el historial de ejecuciones sirve como registro de disponibilidad aproximado.
# #386: antes corría cada 30 min y pedía también GET /reportes/{codigo}, que consulta PostgreSQL.
# Neon solo se suspende tras 5 min sin consultas, así que la base nunca dormía y se agotaron las
# horas gratis del mes. Ahora corre cada 6 horas y solo pide /app/, que no toca la base (es la
# misma ruta del healthCheckPath de render.yaml). El flujo está DESACTIVADO desde el 24-nov
# (`gh workflow disable`); se reactiva con `gh workflow enable "Sondeo de disponibilidad"`.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sondear:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: La PWA responde
        env:
          URL: https://patitas-en-casa-pnnk.onrender.com
        run: |
          # Hasta 3 intentos: el primero puede despertar el servicio (30 a 60 s).
          for intento in 1 2 3; do
            pwa=$(curl -s -o /dev/null -m 90 -w "%{http_code}" "$URL/app/")
            echo "intento $intento: /app/ $pwa"
            if [ "$pwa" = 200 ]; then exit 0; fi
            sleep 20
          done
          echo "::error::La PWA no responde"; exit 1
