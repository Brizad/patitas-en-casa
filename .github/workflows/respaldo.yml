name: Respaldo diario

# RNF-15 (P-07): copia diaria de la base de Neon con pg_dump, cifrada con AES-256 y guardada
# 14 días como artefacto. En el mismo flujo se restaura en una base temporal para comprobar
# que la copia sirve. Sin los secretos NEON_DATABASE_URL y RESPALDO_CLAVE avisa y no falla.
# Antes de copiar comprueba que pg_dump sirve para la versión del servidor (#210) y, después
# (y otra vez a las 08:17), alerta en rojo si el último respaldo guardado tiene más de 26 h.
# Guía: docs/aprende/respaldo.md

on:
  schedule:
    - cron: "17 7 * * *"    # 02:17 hora de Colombia: respaldo y vigilancia
    - cron: "17 13 * * *"   # 08:17 hora de Colombia: solo vigilancia
  workflow_dispatch:
    inputs:
      solo_vigilar:
        description: "Solo revisar la edad del último respaldo (no toca Neon)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read   # la vigilancia lee la lista de artefactos de este repositorio

env:
  # El cliente de pg_dump debe ser de la misma versión que el servidor de Neon, o mayor.
  PG_VERSION: "18"

jobs:
  respaldar:
    # A las 08:17 y con «solo_vigilar» este job no corre: solo la vigilancia de abajo.
    if: github.event.schedule != '17 13 * * *' && inputs.solo_vigilar != true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Revisar los secretos
        id: secretos
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          RESPALDO_CLAVE: ${{ secrets.RESPALDO_CLAVE }}
        run: |
          if [ -z "$NEON_DATABASE_URL" ] || [ -z "$RESPALDO_CLAVE" ]; then
            echo "hay=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Falta el secreto NEON_DATABASE_URL o RESPALDO_CLAVE: no se hizo el respaldo. Ver docs/aprende/respaldo.md"
          else
            echo "hay=true" >> "$GITHUB_OUTPUT"
          fi

      # #210: pg_dump solo respalda servidores de su versión o anteriores. Si Neon se
      # actualiza, aquí se dice qué línea cambiar en vez de fallar con un error críptico.
      - name: Versión del servidor (SHOW server_version_num)
        if: steps.secretos.outputs.hay == 'true'
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          servidor=$(docker run --rm -e NEON_DATABASE_URL "postgres:${PG_VERSION}" \
            sh -c 'psql "$NEON_DATABASE_URL" -Atc "SHOW server_version_num"' 2> /dev/null || true)
          python -m scripts.operacion.vigilar_respaldo version "$servidor" "$PG_VERSION"

      - name: Copia de la base (pg_dump)
        if: steps.secretos.outputs.hay == 'true'
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          docker run --rm -e NEON_DATABASE_URL "postgres:${PG_VERSION}" \
            sh -c 'pg_dump --format=custom --no-owner --no-privileges "$NEON_DATABASE_URL"' \
            > patitas.dump
          test -s patitas.dump
          ls -l patitas.dump

      - name: Cifrar (AES-256-CBC, PBKDF2)
        if: steps.secretos.outputs.hay == 'true'
        env:
          RESPALDO_CLAVE: ${{ secrets.RESPALDO_CLAVE }}
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -pass env:RESPALDO_CLAVE -in patitas.dump -out patitas.dump.enc
          rm patitas.dump
          sha256sum patitas.dump.enc > patitas.dump.enc.sha256

      - name: Probar la restauración en una base temporal
        if: steps.secretos.outputs.hay == 'true'
        env:
          RESPALDO_CLAVE: ${{ secrets.RESPALDO_CLAVE }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -pass env:RESPALDO_CLAVE -in patitas.dump.enc -out prueba.dump
          docker run -d --name temporal -e POSTGRES_HOST_AUTH_METHOD=trust "postgres:${PG_VERSION}"
          for i in $(seq 1 30); do
            docker exec temporal pg_isready -U postgres && break
            sleep 2
          done
          docker exec temporal createdb -U postgres restaurada
          docker cp prueba.dump temporal:/tmp/prueba.dump
          docker exec temporal pg_restore -U postgres -d restaurada --no-owner --exit-on-error /tmp/prueba.dump
          esperadas=$(docker exec temporal pg_restore --list /tmp/prueba.dump | grep -c ' TABLE public ')
          restauradas=$(docker exec temporal psql -U postgres -d restaurada -Atc \
            "select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE'")
          echo "Tablas en la copia: $esperadas · restauradas: $restauradas"
          test "$esperadas" -gt 0
          test "$esperadas" = "$restauradas"
          docker exec temporal psql -U postgres -d restaurada -Atc "select version_num from alembic_version"
          rm -f prueba.dump
          docker rm -f temporal

      - name: Guardar el respaldo cifrado 14 días
        if: steps.secretos.outputs.hay == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: respaldo-${{ github.run_id }}
          path: |
            patitas.dump.enc
            patitas.dump.enc.sha256
          retention-days: 14
          if-no-files-found: error

  # Alerta si no hay un respaldo reciente: cubre el día en que la copia falla, los secretos
  # que faltan (el job de arriba solo avisa en amarillo) y un flujo que dejó de correr.
  vigilar:
    needs: respaldar
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: ¿El último respaldo tiene 26 horas o menos?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Parte 7b: todas las páginas (no solo las 100 más nuevas), solo los respaldos.
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("respaldo-"))' \
            | jq -s '{artifacts: .}' > artefactos.json
          python -m scripts.operacion.vigilar_respaldo respaldos artefactos.json
