[project]
name = "patitas-en-casa"
version = "1.0.0"
description = "Gestión logística de refugios animales con triaje de emergencias"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# #125: el trabajador de video vive en servicios/video (paquete patitas_video).
pythonpath = [".", "servicios/video"]
markers = ["postgres: necesita la base de pruebas PostgreSQL (POSTGRES_DB_PRUEBAS)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C90"]

# RNF-10: complejidad ciclomática ≤ 10 por función, comprobada en cada CI.
[tool.ruff.lint.mccabe]
max-complexity = 10
