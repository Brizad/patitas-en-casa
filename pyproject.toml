[project]
name = "patitas-en-casa"
version = "0.1.0"
description = "Gestión logística de refugios animales con triaje de emergencias"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
