# Despliegue en Render (Blueprint). En Render: New > Blueprint > este repositorio.
# Crea la base PostgreSQL y la API (imagen del Dockerfile: API + PWA en /app/ + panel en /panel/).
databases:
  - name: patitas-bd
    plan: free
    databaseName: patitas
    user: patitas
    postgresMajorVersion: "16"

services:
  - type: web
    name: patitas-en-casa
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /app/
    autoDeploy: true
    envVars:
      - key: POSTGRES_HOST
        fromDatabase: { name: patitas-bd, property: host }
      - key: POSTGRES_PORT
        fromDatabase: { name: patitas-bd, property: port }
      - key: POSTGRES_USER
        fromDatabase: { name: patitas-bd, property: user }
      - key: POSTGRES_PASSWORD
        fromDatabase: { name: patitas-bd, property: password }
      - key: POSTGRES_DB
        fromDatabase: { name: patitas-bd, property: database }
      - key: PATITAS_JWT_SECRETO
        generateValue: true          # Render genera una clave aleatoria; nadie la escribe a mano
      - key: PATITAS_CLAVE_DATOS     # RNF-08 (#111): cifra el contacto opcional del ciudadano
        generateValue: true
      - key: PATITAS_VIDEO_TOKEN     # #125: lo comparte la API con el trabajador local de video
        generateValue: true
      - key: PATITAS_SMTP_HOST       # vacío = los avisos quedan en el log y en la app
        sync: false
      # Primera cuenta de administración (#67): Brayan las escribe en el panel de Render.
      # La cuenta se crea en el primer arranque y no se reemplaza en los siguientes.
      - key: PATITAS_ADMIN_CORREO
        sync: false
      - key: PATITAS_ADMIN_CONTRASENA
        sync: false
      # Datos de demostración (#109): «true» los carga una vez; la contraseña de las
      # cuentas *@demo.patitas.co la escribe Brayan en Render (docs/aprende/avance.md).
      - key: PATITAS_DEMO_ACTIVA
        sync: false
      - key: PATITAS_DEMO_CONTRASENA
        sync: false
