<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dashboards Patitas en Casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Balsamiq+Sans:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
*{box-sizing:border-box}html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Visor: barra de roles + escenario que muestra el dashboard escalado + fichas numeradas que explican cada zona */
:root{
--bg:#EEF1EE; --panel:#FFFFFF; --ink:#16282A; --mute:#5A676B; --line:#D5DDD9; --accent:#0F4F47; --accent-2:#F2A65A; --chip:#E3ECE8;
--f-ui:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif; --f-wf:'Balsamiq Sans','Comic Sans MS','Segoe UI',sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E1716;--panel:#16211F;--ink:#E6EEEB;--mute:#9DB0AB;--line:#2A3936;--accent:#7FC8B9;--accent-2:#F2A65A;--chip:#1F2E2B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1716;--panel:#16211F;--ink:#E6EEEB;--mute:#9DB0AB;--line:#2A3936;--accent:#7FC8B9;--accent-2:#F2A65A;--chip:#1F2E2B;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;padding-inline:16px;padding-block:0 40px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:22px}
header.top h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
header.top p{margin:4px 0 0;color:var(--mute);max-width:70ch}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 14px var(--f-ui);padding:8px 12px;border-radius:999px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;color:var(--ink);font:600 14px var(--f-ui);padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-2);color:#1C1A14}
button:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--mute);font-size:13.5px}
.meta b{color:var(--ink)}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;overflow:hidden}
.viewport{position:relative;overflow:hidden}
.scale{transform-origin:0 0;width:1280px}
.phones{display:flex;gap:28px;justify-content:center;flex-wrap:nowrap;width:max-content}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:12px;min-width:0}
.note .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--panel);font:700 13px var(--f-ui);display:flex;align-items:center;justify-content:center}
.note h3{margin:0 0 4px;font-size:15px}
.note p{margin:0;color:var(--mute);font-size:14px;line-height:1.45}
.note code{font:500 12px var(--f-mono);background:var(--chip);color:var(--ink);padding:1px 6px;border-radius:6px;white-space:nowrap}
.legend{color:var(--mute);font-size:13px}
@media (prefers-reduced-motion:no-preference){.scale{transition:opacity .15s}}
/* modo captura (documento) */
body.shot{padding:0;background:#fff}
body.shot .wrap>*:not(.stage){display:none}
body.shot .stage{border:0;border-radius:0;padding:0}
/* ===================== UI del producto (mockup) ===================== */
.scr{--p-bg:#F6F5F1;--p-side:#0F4F47;--p-side-ink:#D5E6E2;--p-card:#FFFFFF;--p-line:#E4E4DE;--p-ink:#1C2B2D;--p-mute:#5B6670;--p-acc:#F2A65A;--p-teal:#0F6B5E;--p-soft:#E7F1EE;
--c-cri:#9B1C1C;--c-cri-bg:#FDE7E4;--c-alt:#8A3A06;--c-alt-bg:#FDEBDD;--c-med:#6F4A00;--c-med-bg:#FEF3C7;--c-baj:#23613A;--c-baj-bg:#E3F1E7;--c-rev:#5B3E96;--c-rev-bg:#EEE8F7;
font-family:var(--f-ui);color:var(--p-ink);background:var(--p-bg);font-size:15px;line-height:1.35;position:relative}
.scr *{box-sizing:border-box}
.desk{width:1280px;min-height:800px;display:grid;grid-template-columns:232px 1fr}
.side{background:var(--p-side);padding:22px 14px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:17px;padding:2px 8px 20px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--p-acc);color:var(--p-side);display:flex;align-items:center;justify-content:center;flex:none}
.nv{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--p-side-ink);font-weight:600;font-size:14.5px}
.nv.on{background:#fff;color:var(--p-side)}
.nv .ct{margin-left:auto;background:var(--p-acc);color:#1C1A14;border-radius:999px;font-size:12px;padding:1px 8px;font-weight:700}
.side .foot{margin-top:auto;color:var(--p-side-ink);font-size:12.5px;padding:10px 12px;border-top:1px solid rgba(255,255,255,.15)}
.main{padding:22px 26px;display:flex;flex-direction:column;gap:18px;min-width:0}
.bar{display:flex;align-items:center;gap:14px}
.bar h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em}
.bar .sub{color:var(--p-mute);font-size:14px}
.bar .sp{flex:1}
.who{display:flex;align-items:center;gap:8px;background:var(--p-card);border:1px solid var(--p-line);border-radius:999px;padding:5px 12px 5px 5px;font-size:13.5px;font-weight:600}
.av{width:28px;height:28px;border-radius:50%;background:var(--p-soft);color:var(--p-teal);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px;border:1px solid var(--p-line);background:var(--p-card);color:var(--p-ink)}
.btn.pri{background:var(--p-teal);border-color:var(--p-teal);color:#fff}
.btn.warn{background:var(--c-cri);border-color:var(--c-cri);color:#fff}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}.g21{grid-template-columns:1.55fr 1fr}.g12{grid-template-columns:1fr 1.4fr}
.card{background:var(--p-card);border:1px solid var(--p-line);border-radius:14px;padding:18px;position:relative;min-width:0}
.card h4{margin:0 0 12px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h4 .r{margin-left:auto;font-weight:600;font-size:13px;color:var(--p-teal)}
.kpi .l{font-size:12.5px;font-weight:700;color:var(--p-mute);text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:32px;font-weight:800;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:13.5px;color:var(--p-mute);margin-top:2px}
.kpi.alert{border-color:#F2B8B0;background:#FFF7F5}
.kpi.alert .v{color:var(--c-cri)}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.cri{background:var(--c-cri-bg);color:var(--c-cri)}.alt{background:var(--c-alt-bg);color:var(--c-alt)}.med{background:var(--c-med-bg);color:var(--c-med)}.baj{background:var(--c-baj-bg);color:var(--c-baj)}.rev{background:var(--c-rev-bg);color:var(--c-rev)}.neu{background:var(--p-soft);color:var(--p-teal)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--p-mute);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--p-line)}
.t td{padding:10px;border-bottom:1px solid #EFEFEA;vertical-align:middle}
.t tr.sel td{background:#FFF8EF}
.mono{font-family:var(--f-mono);font-size:13px;letter-spacing:.02em}
.mute{color:var(--p-mute)}
.pb{height:10px;border-radius:99px;background:#ECEBE5;overflow:hidden}
.pb span{display:block;height:100%;border-radius:99px;background:var(--p-teal)}
.pb span.hot{background:var(--c-cri)}
.al{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #EFEFEA;font-size:14px}
.al:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:5px}
.ph{background:linear-gradient(135deg,#F7DDBF,#F2C7A0);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#8A5A2B}
.chart{display:block;width:100%;height:auto}
.mk{display:none}
.row{display:flex;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
.in{border:1px solid var(--p-line);background:#fff;border-radius:10px;padding:11px 12px;font-weight:500;color:var(--p-ink);font-size:14.5px}
.in.area{min-height:92px}
.tag{font-size:12px;color:var(--p-mute);font-weight:500}
.ev{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:6px 0}
.ev i{font-style:normal;flex:none;width:20px;height:20px;border-radius:6px;background:var(--p-soft);color:var(--p-teal);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
.tl{display:flex;flex-direction:column;gap:0}
.tl div{display:flex;gap:12px;font-size:14.5px;position:relative;padding:0 0 16px 0}
.tl div:before{content:"";width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--p-line);flex:none;margin-top:2px;z-index:1}
.tl div.ok:before{background:var(--p-teal);border-color:var(--p-teal)}
.tl div.now:before{background:var(--p-acc);border-color:var(--p-acc)}
.tl div:after{content:"";position:absolute;left:6px;top:16px;bottom:0;width:2px;background:var(--p-line)}
.tl div:last-child:after{display:none}
/* teléfono */
.phone{width:360px;border-radius:38px;background:#1E2A2C;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.phone .in-ph{border-radius:28px;overflow:hidden;background:var(--p-bg);height:740px;display:flex;flex-direction:column}
.pst{display:flex;justify-content:space-between;font-size:12px;font-weight:700;padding:10px 20px 6px;color:var(--p-ink)}
.phd{background:var(--p-side);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px}
.pbd{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1;overflow:hidden}
.pcap{text-align:center;font-weight:700;font-size:14px;color:var(--ink);margin-top:10px;font-family:var(--f-ui)}
.big{font-family:var(--f-mono);font-size:30px;letter-spacing:.12em;font-weight:500;text-align:center;background:#fff;border:2px dashed var(--p-acc);border-radius:14px;padding:16px 8px}
.sw{width:42px;height:24px;border-radius:99px;background:var(--p-teal);position:relative;flex:none}
.sw:after{content:"";position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff}
.map{height:150px;border-radius:12px;background:
linear-gradient(90deg,transparent 48%,#fff 48%,#fff 52%,transparent 52%),linear-gradient(0deg,transparent 46%,#fff 46%,#fff 50%,transparent 50%),linear-gradient(30deg,transparent 60%,#fff 60%,#fff 63%,transparent 63%),#DCE8DF;position:relative}
.pin{position:absolute;width:16px;height:16px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff}
.pawtrail{margin-top:auto;padding:0 10px;opacity:1}
.pawtrail+.foot{margin-top:6px}
.av2{width:34px;height:34px;border-radius:50%!important;background:none;overflow:hidden;flex:none}
.wf .pawtrail{display:none}
.vista{display:flex;flex-direction:column;gap:10px;margin-bottom:34px}
.vista:last-child{margin-bottom:0}
.vh{font:700 15px var(--f-ui);color:var(--ink)}
.vh .mono{font:500 13px var(--f-mono);background:var(--chip);padding:2px 8px;border-radius:6px;margin-right:6px}
body.shot .vh{display:none}
.board{width:1280px;padding:26px;display:flex;flex-direction:column;gap:18px}
.sw-row{display:grid;grid-template-columns:repeat(7,1fr);gap:12px}
.swc{display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.swc .sq{height:64px;border-radius:10px;border:1px solid var(--p-line)}
.sk{height:14px;border-radius:7px;background:linear-gradient(90deg,#ECEBE5,#F6F5F1,#ECEBE5)}
.es{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;color:var(--p-ink);font-size:14px}
.es svg{color:var(--p-teal)}
.mk.r{left:auto;right:-11px}
.phones>div{display:flex;flex-direction:column}
.phones .phone{flex:1;display:flex}
.phones .in-ph{height:auto;min-height:740px;flex:1}
.wf .swc .sq{filter:grayscale(1)}
.wf .sk{background:#E3E3E3}
.wf .es svg{color:#555}
/* ===================== Wireframe ===================== */
.wf .scr{--p-bg:#FFFFFF;--p-side:#FFFFFF;--p-side-ink:#555;--p-card:#FFFFFF;--p-line:#9A9A9A;--p-ink:#2B2B2B;--p-mute:#6B6B6B;--p-acc:#BDBDBD;--p-teal:#4A4A4A;--p-soft:#EDEDED;
--c-cri:#2B2B2B;--c-cri-bg:#fff;--c-alt:#2B2B2B;--c-alt-bg:#fff;--c-med:#2B2B2B;--c-med-bg:#fff;--c-baj:#2B2B2B;--c-baj-bg:#fff;--c-rev:#2B2B2B;--c-rev-bg:#fff;font-family:var(--f-wf)}
.wf .side{border-right:2px solid #9A9A9A}
.wf .brand{color:#2B2B2B}
.wf .nv.on{background:#EDEDED;color:#2B2B2B;outline:2px solid #9A9A9A}
.wf .side .foot{border-top-color:#C8C8C8}
.wf .card,.wf .who,.wf .in,.wf .btn{border-width:2px;border-style:solid}
.wf .card{border-radius:6px}
.wf .chip{border:1.5px solid #555;background:#fff;color:#2B2B2B}
.wf .btn.pri,.wf .btn.warn{background:#4A4A4A;border-color:#4A4A4A;color:#fff}
.wf .kpi.alert{background:#fff;border-color:#2B2B2B;border-style:dashed}
.wf .ph,.wf .map{background:#fff;border:2px solid #9A9A9A;border-radius:6px;position:relative;color:transparent}
.wf .ph *, .wf .map *{visibility:hidden}
.wf .ph:before,.wf .map:before{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent calc(50% - 1px),#9A9A9A,transparent calc(50% + 1px)),linear-gradient(to top left,transparent calc(50% - 1px),#9A9A9A,transparent calc(50% + 1px))}
.wf .chart rect,.wf .chart path.fill{fill:#DDDDDD!important}
.wf .chart path.ln{stroke:#555!important}
.wf .chart circle{fill:#555!important}
.wf .pb span,.wf .pb span.hot{background:repeating-linear-gradient(45deg,#777 0 4px,#bbb 4px 8px)}
.wf .dot{background:#777!important}
.wf .phone{background:#fff;border:3px solid #555;box-shadow:none}
.wf .phd{color:#2B2B2B;border-bottom:2px solid #9A9A9A}
.wf .sw{background:#777}
.wf .big{border-color:#555}
.wf .logo{background:#fff;border:2px solid #555;color:#555}
.wf .mk{display:flex;position:absolute;top:-11px;left:-11px;width:24px;height:24px;border-radius:50%;background:#E8552B;color:#fff;font:700 13px var(--f-ui);align-items:center;justify-content:center;z-index:5;box-shadow:0 0 0 3px #fff}
.wf .tl div.ok:before,.wf .tl div.now:before{background:#555;border-color:#555}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
<div>
<h1>Patitas en Casa · Dashboards por rol</h1>
<p>Prototipo de la Semana 3: cada rol tiene su dashboard en dos niveles de fidelidad. El wireframe muestra la estructura con zonas numeradas; el mockup muestra el diseño final. Los datos son de ejemplo.</p>
</div>
<div class="ctrl">
<div class="seg" role="group" aria-label="Nivel de fidelidad">
<button id="m-wf" aria-pressed="false">Wireframe</button>
<button id="m-mk" aria-pressed="true">Mockup</button>
</div>
</div>
</header>
<nav class="tabs" id="tabs" aria-label="Roles"></nav>
<div class="meta" id="meta"></div>
<section class="stage"><div class="viewport" id="vp"><div class="scale" id="sc"></div></div></section>
<p class="legend" id="legend"></p>
<section class="notes" id="notes" aria-label="Explicación de cada zona"></section>
</div>
<script>
const I={
home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
grid:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
list:'<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>',
truck:'<path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/>',
heart:'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>',
box:'<path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/>',
chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14c3 0 6 2 6 5"/>',
gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
doc:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/>',
shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
pin:'<path d="M12 21s-6-6-6-11a6 6 0 0 1 12 0c0 5-6 11-6 11z"/><circle cx="12" cy="10" r="2"/>',
cam:'<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/>',
paw:'<circle cx="7" cy="9" r="1.8"/><circle cx="12" cy="6.5" r="1.8"/><circle cx="17" cy="9" r="1.8"/><path d="M8 16c0-2.4 1.8-4 4-4s4 1.6 4 4c0 1.4-1.2 2-4 2s-4-.6-4-2z"/>',
search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',
lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'
};
const ic=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
const mk=n=>`<span class="mk">${n}</span>`;
const chip=(p,t)=>`<span class="chip ${p}">${t}</span>`;
const PR={cri:'Crítica',alt:'Alta',med:'Media',baj:'Baja',rev:'Requiere revisión'};
const logo=`<span class="logo">${ic('paw',22)}</span>`;
function desk(nav,active,title,sub,user,body,foot){
return `<div class="scr desk"><aside class="side"><div class="brand">${logo}Patitas en Casa</div>
${nav.map(([n,i,c])=>`<div class="nv${n===active?' on':''}">${ic(i)}${n}${c?`<span class="ct">${c}</span>`:''}</div>`).join('')}
<div class="pawtrail">${paws()}</div><div class="foot">${foot}</div></aside>
<main class="main"><div class="bar"><div><h2>${title}</h2><div class="sub">${sub}</div></div><span class="sp"></span>
<div class="who"><span class="av">${user[0]}</span>${user[1]}</div></div>${body}</main></div>`;
}
function phone(head,body,cap){

// barras a escala: valores, máximo del eje, etiquetas
function bars(vals,max,labels,w=520,h=170,hot=[]){
const pad=28,bw=(w-pad-10)/vals.length,ch=h-34;
let g='';
[0,.5,1].forEach(f=>{const y=10+ch-ch*f;g+=`<line x1="${pad}" x2="${w}" y1="${y}" y2="${y}" stroke="#E4E4DE"/><text x="${pad-6}" y="${y+4}" font-size="11" text-anchor="end" fill="#5B6670">${Math.round(max*f)}</text>`});
vals.forEach((v,i)=>{const bh=ch*v/max,x=pad+i*bw+bw*.18;
g+=`<rect x="${x}" y="${10+ch-bh}" width="${bw*.64}" height="${bh}" rx="4" fill="${hot.includes(i)?'#C2410C':'#0F6B5E'}"/>`+
`<text x="${x+bw*.32}" y="${h-6}" font-size="11.5" text-anchor="middle" fill="#5B6670">${labels[i]}</text>`+
`<text x="${x+bw*.32}" y="${6+ch-bh}" font-size="11.5" text-anchor="middle" fill="#1C2B2D" font-weight="700">${v}</text>`});
return `<svg class="chart" viewBox="0 0 ${w} ${h}">${g}</svg>`;
}
function line(vals,max,labels,w=520,h=170,vals2){
const pad=28,ch=h-34,step=(w-pad-20)/(vals.length-1);
const pt=(v,i)=>[pad+10+i*step,10+ch-ch*v/max];
let g='';
[0,.5,1].forEach(f=>{const y=10+ch-ch*f;g+=`<line x1="${pad}" x2="${w}" y1="${y}" y2="${y}" stroke="#E4E4DE"/><text x="${pad-6}" y="${y+4}" font-size="11" text-anchor="end" fill="#5B6670">${Math.round(max*f)}</text>`});
const P=vals.map(pt);
g+=`<path class="fill" d="M${P[0][0]},${10+ch} L${P.map(p=>p.join(',')).join(' L')} L${P[P.length-1][0]},${10+ch}Z" fill="#0F6B5E" fill-opacity=".12"/>`;
g+=`<path class="ln" d="M${P.map(p=>p.join(',')).join(' L')}" fill="none" stroke="#0F6B5E" stroke-width="2.5"/>`;
if(vals2){const Q=vals2.map(pt);g+=`<path class="ln" d="M${Q.map(p=>p.join(',')).join(' L')}" fill="none" stroke="#C2410C" stroke-width="2" stroke-dasharray="5 4"/>`}
P.forEach((p,i)=>{g+=`<text x="${p[0]}" y="${h-6}" font-size="11.5" text-anchor="middle" fill="#5B6670">${labels[i]}</text>`});
const L=P[P.length-1];g+=`<circle cx="${L[0]}" cy="${L[1]}" r="4.5" fill="#0F6B5E"/>`;
return `<svg class="chart" viewBox="0 0 ${w} ${h}">${g}</svg>`;
}

[10,'Bloqueado por regla','<div class="es">'+ic('lock',30)+'<b>El refugio está lleno (40 / 40)</b><span class="tag">Registra un egreso o propone un traslado.</span><span class="btn pri" style="padding:6px 12px">Proponer traslado</span></div>','La regla dura se explica con su salida (RN-04).'],
[11,'Sin permiso','<div class="es">'+ic('shield',30)+'<b>Esta sección es para veterinarios</b><span class="tag">Tu rol no permite confirmar prioridades.</span></div>','Respuesta al control de roles (RN-06, RF-13).'],
[12,'Éxito','<div class="es"><div class="ph art" style="width:70px;height:70px;border-radius:50%;background:none">'+dog()+'</div><b>Prioridad confirmada</b><span class="tag">Se avisó a 5 rescatistas cercanos.</span></div>','Confirma la acción y su efecto.']
].map(([n,t,b,d])=>`<div class="card">${mk(n)}<h4>${t}</h4><div style="min-height:150px;display:flex;flex-direction:column;justify-content:center">${b}</div><div class="tag" style="margin-top:10px">${d}</div></div>`).join('')}
</div></div>`}],
notas:[
[1,'Paleta','Verde de refugio para la estructura, verde de acción para lo que se puede tocar y ámbar como acento de marca. El texto cumple contraste AA sobre el fondo.','RNF-11'],
[2,'Prioridades','Cinco estados con color y nombre, siempre juntos. Cambian a contorno en el wireframe.','RF-02 · RN-02 · RNF-11'],
[3,'Tipografía','Figtree para la interfaz y una monoespaciada para códigos y requisitos, para distinguir datos del sistema.','RNF-06'],
[4,'Componentes','Botones, campos, interruptores, indicadores y barras de cupo reutilizados en todas las pantallas.','RNF-06'],
[5,'Cargando','Esqueleto de carga.','RNF-01'],[6,'Vacío','Estado sin datos con explicación.','RNF-06'],[7,'Error','Error de red con reintento.','RNF-04'],
[8,'Sin conexión','Guardado local del reporte en la PWA.','RF-12'],[9,'Validación','Error de formulario junto al campo.','RN-01'],
[10,'Bloqueado','Regla de negocio que impide la acción y ofrece una salida.','RN-04'],[11,'Sin permiso','Control de acceso por rol.','RF-13 · RN-06'],[12,'Éxito','Confirmación de la acción.','RF-04 · RF-05']]}
];
const st={rol:'coordinador',modo:'mk'};
const tabs=document.getElementById('tabs'),sc=document.getElementById('sc'),vp=document.getElementById('vp');
R.forEach(r=>{const b=document.createElement('button');b.className='tab';b.textContent=r.nombre;b.id='t-'+r.id;b.onclick=()=>{st.rol=r.id;draw()};tabs.appendChild(b)});
document.getElementById('m-wf').onclick=()=>{st.modo='wf';draw()};
document.getElementById('m-mk').onclick=()=>{st.modo='mk';draw()};
function fit(){const w=vp.clientWidth;sc.style.width='max-content';sc.style.transform='none';const nat=sc.scrollWidth;sc.style.width=nat+'px';const s=Math.min(1,w/nat);sc.style.transform=`scale(${s})`;vp.style.height=(sc.scrollHeight*s)+'px'}
function draw(){
const r=R.find(x=>x.id===st.rol);
R.forEach(x=>document.getElementById('t-'+x.id).setAttribute('aria-pressed',x.id===st.rol));
document.getElementById('m-wf').setAttribute('aria-pressed',st.modo==='wf');document.getElementById('m-mk').setAttribute('aria-pressed',st.modo==='mk');
document.querySelector('.stage').classList.toggle('wf',st.modo==='wf');
sc.innerHTML=r.vistas.map(v=>`<section class="vista" data-id="${v.id}"><div class="vh"><span class="mono">${v.id}</span> ${v.nombre}</div><div class="vb">${v.html()}</div></section>`).join('');
document.getElementById('meta').innerHTML=`<span><b>${r.nombre}.</b> ${r.quien}</span><span>Dispositivo: <b>${r.tipo==='desk'?'computador':'celular (PWA)'}</b></span>`;
document.getElementById('legend').textContent=st.modo==='wf'?'Wireframe: estructura en escala de grises. Los círculos numerados corresponden a las fichas de abajo.':'Mockup: diseño final con la identidad de Patitas en Casa. Cambia a Wireframe para ver las zonas numeradas.';
document.getElementById('notes').innerHTML=r.notas.map(([n,t,p,tr])=>`<article class="note"><span class="n">${n}</span><div><h3>${t}</h3><p>${p}</p><p style="margin-top:6px">${tr.split(' · ').map(x=>`<code>${x}</code>`).join(' ')}</p></div></article>`).join('');
requestAnimationFrame(fit);
try{history.replaceState(null,'','#'+st.rol+(st.modo==='wf'?'-wf':''))}catch(e){}
}
const h=(location.hash||'').slice(1);
if(h){const p=h.split('-');if(R.some(r=>r.id===p[0]))st.rol=p[0];if(p.includes('wf'))st.modo='wf';if(p.includes('shot'))document.body.classList.add('shot')}
window.addEventListener('resize',fit);
draw();
if(document.fonts)document.fonts.ready.then(fit);
</script>
<script src="interaccion.js"></script>
</body>
</html>
