<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Arquitectura de Patitas en Casa">
  <title>Arquitectura de Patitas en Casa</title>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffeb"/>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-family="Georgia, serif" fill="#1a1a1a">Patitas en Casa · arquitectura</text>

  <!-- Navegador -->
  <rect x="20" y="60" width="250" height="330" rx="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="145" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">Navegador (celular o PC)</text>
  <rect x="40" y="102" width="210" height="76" rx="12" fill="#f0d7ff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="145" y="126" text-anchor="middle" font-size="14" font-weight="700">PWA ciudadana · /app/</text>
  <text x="145" y="146" text-anchor="middle" font-size="12">HTML + CSS + JS, sin cuenta</text>
  <text x="145" y="164" text-anchor="middle" font-size="12">funciona sin señal (cola local)</text>
  <rect x="40" y="192" width="210" height="76" rx="12" fill="#f0d7ff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="145" y="216" text-anchor="middle" font-size="14" font-weight="700">Panel por rol · /panel/</text>
  <text x="145" y="236" text-anchor="middle" font-size="12">React + TypeScript (Vite)</text>
  <text x="145" y="254" text-anchor="middle" font-size="12">sesión con token JWT</text>
  <rect x="40" y="282" width="210" height="58" rx="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="145" y="306" text-anchor="middle" font-size="14" font-weight="700">Portada · /</text>
  <text x="145" y="326" text-anchor="middle" font-size="12">HTML + CSS, sin JavaScript</text>
  <text x="145" y="362" text-anchor="middle" font-size="12" fill="#5c5c54">7 roles: ciudadano, veterinario,</text>
  <text x="145" y="378" text-anchor="middle" font-size="12" fill="#5c5c54">coordinador, rescatista, adoptante…</text>

  <!-- Render -->
  <rect x="340" y="60" width="320" height="330" rx="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="500" y="86" text-anchor="middle" font-size="15" font-weight="700">Render (Docker) · API REST</text>
  <text x="500" y="106" text-anchor="middle" font-size="12" fill="#5c5c54">FastAPI + Uvicorn, Python · app/api/main.py</text>
  <g font-size="13">
    <rect x="360" y="120" width="280" height="40" rx="10" fill="#ffffeb" stroke="#1a1a1a"/>
    <text x="500" y="145" text-anchor="middle">Rutas por módulo + seguridad (roles, CSP)</text>
    <rect x="360" y="168" width="280" height="40" rx="10" fill="#ffffeb" stroke="#1a1a1a"/>
    <text x="500" y="193" text-anchor="middle">Servicios con las reglas RN-01 a RN-16</text>
    <rect x="360" y="216" width="280" height="40" rx="10" fill="#ffffeb" stroke="#1a1a1a"/>
    <text x="500" y="241" text-anchor="middle">Triaje IA: reglas + TF-IDF (falla segura)</text>
    <rect x="360" y="264" width="280" height="40" rx="10" fill="#ffffeb" stroke="#1a1a1a"/>
    <text x="500" y="289" text-anchor="middle">Outbox de avisos y tareas de fondo</text>
    <rect x="360" y="312" width="280" height="40" rx="10" fill="#ffffeb" stroke="#1a1a1a"/>
    <text x="500" y="337" text-anchor="middle">Repositorios (SQLAlchemy Core)</text>
  </g>
  <text x="500" y="376" text-anchor="middle" font-size="12" fill="#5c5c54">sirve también la PWA, el panel y la portada</text>

  <!-- Externos -->
  <rect x="730" y="60" width="250" height="96" rx="18" fill="#034f46" stroke="#1a1a1a" stroke-width="2"/>
  <text x="855" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffeb">PostgreSQL 18 · Neon</text>
  <text x="855" y="114" text-anchor="middle" font-size="12" fill="#ffffeb">migraciones con Alembic</text>
  <text x="855" y="132" text-anchor="middle" font-size="12" fill="#ffffeb">contacto cifrado (AES-256-GCM)</text>
  <rect x="730" y="176" width="250" height="70" rx="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="855" y="206" text-anchor="middle" font-size="15" font-weight="700">Mailjet</text>
  <text x="855" y="226" text-anchor="middle" font-size="12">correos de avisos (HTTPS)</text>
  <rect x="730" y="266" width="250" height="124" rx="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="855" y="294" text-anchor="middle" font-size="15" font-weight="700">Nodo de video local</text>
  <text x="855" y="314" text-anchor="middle" font-size="12">PC del equipo (WSL2), Python</text>
  <text x="855" y="332" text-anchor="middle" font-size="12">MediaPipe + DeepLabCut + MLP</text>
  <text x="855" y="350" text-anchor="middle" font-size="12">pide trabajos a la API; si está</text>
  <text x="855" y="368" text-anchor="middle" font-size="12">apagado, el reporte sigue con el texto</text>

  <!-- GitHub Actions -->
  <rect x="20" y="430" width="960" height="110" rx="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="500" y="458" text-anchor="middle" font-size="15" font-weight="700">GitHub Actions</text>
  <text x="500" y="484" text-anchor="middle" font-size="13">CI en cada PR: gitleaks · Ruff · pytest (cobertura ≥ 90 %) · panel (Vitest) · axe-core y Lighthouse · e2e con Playwright</text>
  <text x="500" y="506" text-anchor="middle" font-size="13">Seguridad: Bandit, Semgrep, pip-audit, npm audit, OWASP ZAP · respaldo diario cifrado (pg_dump)</text>
  <text x="500" y="528" text-anchor="middle" font-size="13">verificación del despliegue · restauración manual en una base nueva</text>

  <!-- Flechas -->
  <g stroke="#1a1a1a" stroke-width="2" fill="none" marker-end="url(#flecha)">
    <path d="M250 140 L338 140"/>
    <path d="M250 230 L338 230"/>
    <path d="M250 311 L338 311"/>
    <path d="M662 108 L728 108"/>
    <path d="M662 211 L728 211"/>
    <path d="M728 328 L662 328"/>
  </g>
  <g font-size="11" fill="#1a1a1a">
    <text x="294" y="133" text-anchor="middle">JSON</text>
    <text x="294" y="223" text-anchor="middle">JWT</text>
    <text x="695" y="101" text-anchor="middle">SQL/TLS</text>
    <text x="695" y="204" text-anchor="middle">avisos</text>
    <text x="695" y="321" text-anchor="middle">HTTPS</text>
  </g>
</svg>
